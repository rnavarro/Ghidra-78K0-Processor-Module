 * This gradle script only works when the 78K0 directory is placed inside a
 * Ghidra source checkout, at Ghidra/Processors/78K0. It applies scripts that
 * exist in that tree ($rootProject.projectDir/gradle/), which a standalone
 * clone of this repository does not have.
 *
 * It is here so the module can be built and tested as an in-tree processor
 * module, which is what a language specification for the upstream Ghidra
 * project would need, and what SleighDevTools pcodetest requires.
